<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>新しいパスワード | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="card border-0 shadow-sm mx-auto mt-5" style="max-width:440px"><div class="card-body p-4"><h1 class="h4 mb-3">新しいパスワードを設定</h1><div th:if="${param.error}" class="alert alert-danger">リンクが無効か期限切れです。</div><form th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label class="form-label" for="password">新しいパスワード（12文字以上）</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="12" maxlength="72" required><label class="form-label" for="passwordConfirmation">確認</label><input class="form-control mb-3" id="passwordConfirmation" name="passwordConfirmation" type="password" minlength="12" maxlength="72" required><button class="btn btn-primary w-100">パスワードを変更</button></form></div></main></body></html>
