<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>パスワード再設定 | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><main class="card border-0 shadow-sm mx-auto mt-5 auth-message-card forgot-password-card"><div class="card-body p-4"><h1 class="h4">パスワード再設定</h1><p class="text-muted">登録メールアドレスを入力してください。</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><form th:action="@{/forgot-password}" method="post"><label class="form-label" for="email">メールアドレス</label><input class="form-control mb-3" id="email" name="email" type="email" required maxlength="254"><button class="btn btn-primary w-100">再設定メールを送信</button></form><a class="d-block mt-3 text-center" th:href="@{/login}">ログインへ戻る</a></div></main></body></html>
