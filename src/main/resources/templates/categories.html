<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>カテゴリ | 予算管理</title>
</head>
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h1 class="page-heading mb-0">カテゴリ管理</h1>
        <p class="page-subtitle mb-0">取引と予算に使うカテゴリを設定します。</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header bg-white">
                    <div class="fw-semibold">カテゴリを追加</div>
                    <div class="small text-muted mt-1">収入または支出の分類を作成します。</div>
                </div>
                <div class="card-body">
                    <form th:action="@{/categories}" method="post" th:object="${category}">
                        <div class="mb-3">
                            <label class="form-label">名前</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">種類</label>
                            <select class="form-select" th:field="*{type}" required>
                                <option value="EXPENSE">支出</option>
                                <option value="INCOME">収入</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">色</label>
                            <input type="color" class="form-control form-control-color" th:field="*{color}" value="#6c757d">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">追加</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white">
                    <div class="fw-semibold">カテゴリ一覧</div>
                    <div class="small text-muted mt-1">現在登録されている分類</div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>色</th>
                            <th>名前</th>
                            <th>種類</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${categories}">
                            <td>
                                <span class="d-inline-block rounded-circle category-color-chip"
                                      th:style="|--chip-color: ${c.color}|"></span>
                            </td>
                            <td th:text="${c.name}">食費</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${c.type == 'INCOME'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${c.type == 'INCOME' ? '収入' : '支出'}">支出</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
                                      class="d-inline" onsubmit="return confirm('削除しますか？');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
