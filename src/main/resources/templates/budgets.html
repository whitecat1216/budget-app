<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>予算 | 予算管理</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="page-heading mb-0">予算管理</h1>
            <p class="page-subtitle mb-0">カテゴリごとの月次予算と支出状況を管理します。</p>
        </div>
        <div class="btn-group">
            <a th:href="@{/budgets(year=${prevYearMonth.year}, month=${prevYearMonth.monthValue})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-chevron-left"></i>
            </a>
            <span class="btn btn-outline-secondary btn-sm disabled"
                  th:text="${year + '年' + month + '月'}">2026年10月</span>
            <a th:href="@{/budgets(year=${nextYearMonth.year}, month=${nextYearMonth.monthValue})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-chevron-right"></i>
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header bg-white">
                    <div class="fw-semibold">予算を設定</div>
                    <div class="small text-muted mt-1" th:text="${year + '年' + month + '月の予算を登録'}">対象月の予算を登録</div>
                </div>
                <div class="card-body">
                    <form th:action="@{/budgets}" method="post">
                        <input type="hidden" name="year" th:value="${year}">
                        <input type="hidden" name="month" th:value="${month}">
                        <div class="mb-3">
                            <label class="form-label">カテゴリ（支出）</label>
                            <select class="form-select" name="categoryId" required>
                                <option value="">選択してください</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">食費</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="budgetDepartment">部門</label>
                            <select class="form-select" id="budgetDepartment" name="departmentId">
                                <option value="">部門共通</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">営業部</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="budgetProject">プロジェクト</label>
                            <select class="form-select" id="budgetProject" name="projectId">
                                <option value="">プロジェクトなし</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}">新商品販促</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">予算額</label>
                            <div class="input-group">
                                <span class="input-group-text">¥</span>
                                <input type="number" class="form-control" name="amount"
                                       min="0" step="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">設定</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white">
                    <div class="fw-semibold">予算一覧</div>
                    <div class="small text-muted mt-1">設定額、使用額、残額を確認できます。</div>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(budgets)}" class="empty-state">
                        <i class="bi bi-wallet2"></i>
                        <div>この月の予算はまだ設定されていません。</div>
                    </div>
                    <table class="table table-hover mb-0" th:if="${!#lists.isEmpty(budgets)}">
                        <thead>
                        <tr>
                            <th>部門 / プロジェクト</th>
                            <th>カテゴリ</th>
                            <th class="text-end">予算</th>
                            <th class="text-end">使用額</th>
                            <th class="text-end">残額</th>
                            <th class="budget-progress-heading">進捗</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="b : ${budgets}">
                            <td><div th:text="${b.departmentName == null ? '全社共通' : b.departmentName}">全社共通</div><div class="small text-muted" th:text="${b.projectName == null ? '—' : b.projectName}">—</div></td>
                            <td class="fw-semibold" th:text="${b.categoryName}">食費</td>
                            <td class="text-end"
                                th:text="'¥' + ${#numbers.formatDecimal(b.amount, 1, 'COMMA', 0, 'POINT')}">¥0</td>
                            <td class="text-end"
                                th:text="'¥' + ${#numbers.formatDecimal(b.spent, 1, 'COMMA', 0, 'POINT')}">¥0</td>
                            <td class="text-end"
                                th:classappend="${b.amount.subtract(b.spent).compareTo(T(java.math.BigDecimal).ZERO) < 0} ? 'text-danger' : 'text-success'"
                                th:text="'¥' + ${#numbers.formatDecimal(b.amount.subtract(b.spent), 1, 'COMMA', 0, 'POINT')}">¥0</td>
                            <td>
                                <div class="progress">
                                    <div class="progress-bar"
                                         th:classappend="${b.spent.compareTo(b.amount) > 0} ? 'bg-danger' : 'bg-success'"
                                         th:style="|--progress-width: ${b.amount.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 0 : T(java.lang.Math).min(100, b.spent.doubleValue() / b.amount.doubleValue() * 100)}%|"
                                         role="progressbar" th:aria-valuenow="${b.amount.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 0 : T(java.lang.Math).min(100, b.spent.doubleValue() / b.amount.doubleValue() * 100)}" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </td>
                            <td class="text-end"><a class="btn btn-sm btn-outline-primary text-nowrap" th:href="@{/budget-change-requests(budgetId=${b.id})}">変更申請</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
