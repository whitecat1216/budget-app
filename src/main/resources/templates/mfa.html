<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head><title>多要素認証 | NEXUS</title></head><body><div th:fragment="content">
    <div class="mb-4"><h1 class="page-heading mb-0">多要素認証</h1><p class="page-subtitle mb-0">認証アプリのワンタイムコードを使ってログインを保護します。</p></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="card"><div class="card-body">
        <div th:if="${!encryptionConfigured}" class="alert alert-warning">MFAを有効にするには、サーバーにMFA_ENCRYPTION_KEY（Base64形式の32バイト鍵）を設定してください。</div>
        <div th:if="${enabled}"><span class="badge text-bg-success">有効</span><p class="mt-3">ログイン時に認証アプリのコードが必要です。</p>
            <form th:action="@{/mfa/disable}" method="post" class="row g-2"><div class="col-sm-4"><label class="form-label" for="disableCode">現在の認証コード</label><input id="disableCode" name="code" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="col-sm-auto align-self-end"><button class="btn btn-outline-danger" type="submit">MFAを解除</button></div></form>
        </div>
        <div th:if="${!enabled && pendingSecret == null}"><p>未設定です。設定後はログインのたびに認証コードが必要になります。</p><form th:action="@{/mfa/enroll}" method="post"><button class="btn btn-primary" type="submit" th:disabled="${!encryptionConfigured}">設定を開始</button></form></div>
        <div th:if="${!enabled && pendingSecret != null}" class="mt-3"><h2 class="h5">認証アプリへ登録</h2><p>認証アプリで次の秘密鍵を登録するか、otpauth URIを手動入力してください。確認が終わるまでこのページを閉じないでください。</p><div class="mb-3"><span class="form-label d-block">秘密鍵</span><code class="user-select-all" th:text="${pendingSecret}"></code></div><details class="mb-3"><summary>otpauth URI</summary><code class="d-block text-break mt-2" th:text="${provisioningUri}"></code></details>
            <form th:action="@{/mfa/confirm}" method="post" class="row g-2"><div class="col-sm-4"><label class="form-label" for="confirmCode">6桁の認証コード</label><input id="confirmCode" name="code" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="col-sm-auto align-self-end"><button class="btn btn-primary" type="submit">有効化</button></div></form>
        </div>
    </div></section>
</div></body></html>
