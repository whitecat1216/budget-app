<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>初期セットアップ | NEXUS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head><body>
<main class="card auth-card onboarding-card"><div class="card-body p-4 p-md-5">
    <div class="brand mb-4">NEXUS <span class="text-muted fs-6">初期セットアップ</span></div>
    <h1 class="h4 mb-1">企業の基本設定</h1>
    <p class="text-muted small mb-4">会計年度と通貨を設定します。会計連携はサービス選定後に設定できます。</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/onboarding}" method="post" th:object="${onboardingForm}">
        <div class="mb-3"><label class="form-label" for="companyName">企業名</label><input id="companyName" class="form-control" th:field="*{companyName}" required maxlength="160"><div class="small text-danger" th:errors="*{companyName}"></div></div>
        <div class="mb-3"><label class="form-label" for="fiscalYearStartMonth">会計年度の開始月</label><select id="fiscalYearStartMonth" class="form-select" th:field="*{fiscalYearStartMonth}"><option th:each="month : ${#numbers.sequence(1,12)}" th:value="${month}" th:text="${month + '月'}">4月</option></select></div>
        <div class="mb-3"><label class="form-label" for="baseCurrency">基準通貨</label><select id="baseCurrency" class="form-select" th:field="*{baseCurrency}"><option value="JPY">日本円 (JPY)</option></select><div class="form-text">現行の金額表示は日本円に対応しています。</div><div class="small text-danger" th:errors="*{baseCurrency}"></div></div>
        <div class="mb-3"><label class="form-label" for="timezone">タイムゾーン</label><select id="timezone" class="form-select" th:field="*{timezone}"><option value="Asia/Tokyo">日本標準時 (Asia/Tokyo)</option></select><div class="form-text">現行の日時表示は日本標準時を前提としています。</div></div>
        <hr class="my-4"><h2 class="h6">初期部門 <span class="text-muted fw-normal">（任意）</span></h2>
        <div class="row g-2 mb-4"><div class="col-sm-4"><label class="form-label" for="departmentCode">部門コード</label><input id="departmentCode" class="form-control" th:field="*{departmentCode}" maxlength="40"></div><div class="col-sm-8"><label class="form-label" for="departmentName">部門名</label><input id="departmentName" class="form-control" th:field="*{departmentName}" maxlength="120"></div><div class="small text-danger" th:errors="*{departmentCode}"></div><div class="small text-danger" th:errors="*{departmentName}"></div></div>
        <button class="btn btn-primary w-100" type="submit">設定を保存して開始</button>
    </form>
</div></main></body></html>
