<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head><title>監査ログ | NEXUS</title></head><body><div th:fragment="content">
    <div class="mb-4"><h1 class="page-heading mb-0">監査ログ</h1><p class="page-subtitle mb-0">企業内の重要な変更と承認操作を確認できます。</p></div>
    <section class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>詳細</th></tr></thead><tbody>
        <tr th:each="event : ${events}"><td class="text-nowrap" th:text="${event['created_at']}">2026-10-18 12:00:00</td><td th:text="${event['actor_name'] == null ? 'システム' : event['actor_name']}">管理者</td><td th:text="${event['action']}">CREATE</td><td th:text="${event['entity_type'] + (event['entity_id'] == null ? '' : ' #' + event['entity_id'])}">BUDGET #1</td><td th:text="${event['details']}">登録</td></tr>
        <tr th:if="${#lists.isEmpty(events)}"><td colspan="5" class="text-center text-muted py-5">記録された操作はありません。</td></tr>
    </tbody></table></div></section>
</div></body></html>
