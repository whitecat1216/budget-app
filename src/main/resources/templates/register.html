<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>企業登録 | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head><body><main class="card auth-card register"><div class="card-body p-4 p-md-5">
    <div class="brand mb-4">NEXUS <span class="text-muted fs-6">企業登録</span></div><h1 class="h4 mb-1">企業アカウントを作成</h1><p class="text-muted small mb-4">登録後、メール認証を行うと利用を開始できます。</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/register}" method="post" th:object="${registrationForm}">
        <div class="mb-3"><label class="form-label" for="companyName">企業名</label><input id="companyName" class="form-control" th:field="*{companyName}" required maxlength="160"><div class="small text-danger" th:errors="*{companyName}"></div></div>
        <div class="mb-3"><label class="form-label" for="displayName">管理者氏名</label><input id="displayName" class="form-control" th:field="*{displayName}" required maxlength="120"><div class="small text-danger" th:errors="*{displayName}"></div></div>
        <div class="mb-3"><label class="form-label" for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" class="form-control" th:field="*{email}" required><div class="small text-danger" th:errors="*{email}"></div></div>
        <div class="mb-3"><label class="form-label" for="password">パスワード（12文字以上）</label><input id="password" type="password" autocomplete="new-password" class="form-control" th:field="*{password}" minlength="12" required><div class="small text-danger" th:errors="*{password}"></div></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" id="termsAccepted" required><label class="form-check-label small" for="termsAccepted">利用規約・プライバシー方針に同意します</label></div>
        <button class="btn btn-primary w-100" type="submit">確認メールを送信</button>
    </form><div class="text-center small mt-4"><a th:href="@{/login}">ログインに戻る</a></div>
</div></main></body></html>
