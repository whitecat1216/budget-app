<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>追加認証 | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><main class="container py-5" style="max-width: 440px"><section class="card shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-2">追加認証</h1><p class="text-muted">認証アプリに表示された6桁のコードを入力してください。</p><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><form th:action="@{/mfa/challenge}" method="post"><label class="form-label" for="code">認証コード</label><input id="code" name="code" class="form-control form-control-lg text-center mb-3" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus><button class="btn btn-primary w-100" type="submit">確認</button></form><form th:action="@{/logout}" method="post" class="mt-3 text-center"><button class="btn btn-link" type="submit">ログアウト</button></form></div></section></main></body></html>
