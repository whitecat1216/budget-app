<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f4f6fa;color:#17243b}.auth-card{max-width:440px;margin:8vh auto;border:1px solid #e8ecf2;border-radius:14px;box-shadow:0 12px 40px #18274b12}.brand{color:#14243f;font-weight:800;letter-spacing:.1em}.form-control{min-height:44px}</style>
</head><body><main class="card auth-card"><div class="card-body p-4 p-md-5">
    <div class="brand mb-4">NEXUS <span class="text-muted fs-6">予算管理</span></div><h1 class="h4 mb-1">ログイン</h1><p class="text-muted small mb-4">登録済みの企業アカウントでログインします。</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/login}" method="post"><div class="mb-3"><label for="email" class="form-label">メールアドレス</label><input id="email" name="email" type="email" class="form-control" autocomplete="username" required></div><div class="mb-2"><label for="password" class="form-label">パスワード</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div><div class="text-end small mb-4"><a th:href="@{/forgot-password}">パスワードを忘れた場合</a></div><button class="btn btn-primary w-100" type="submit">ログイン</button></form>
    <div class="text-center small mt-4">企業アカウントをお持ちでない方は <a th:href="@{/register}">新規登録</a></div>
</div></main></body></html>
