<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">予算管理アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #14243f;
            --navy-soft: #1e3153;
            --blue: #2764e7;
            --ink: #17243b;
            --muted: #78869a;
            --canvas: #f4f6fa;
            --line: #e8ecf2;
        }
        body { background: var(--canvas); color: var(--ink); font-size: .94rem; }
        .app-shell { min-height: 100vh; }
        .sidebar {
            background: var(--navy); bottom: 0; color: #fff; left: 0; overflow-y: auto;
            padding: 1.35rem 1rem; position: fixed; top: 0; width: 248px; z-index: 1020;
        }
        .brand { align-items: center; color: #fff; display: flex; gap: .75rem; margin: .25rem .55rem 2.2rem; text-decoration: none; }
        .brand-mark { align-items: center; background: var(--blue); border-radius: 9px; display: flex; font-size: 1.1rem; height: 36px; justify-content: center; width: 36px; }
        .brand-name { font-size: 1rem; font-weight: 750; letter-spacing: .08em; }
        .brand-caption { color: #aebbd0; font-size: .65rem; letter-spacing: .12em; }
        .nav-section { color: #8292ad; font-size: .65rem; font-weight: 700; letter-spacing: .12em; margin: 1.2rem .65rem .45rem; text-transform: uppercase; }
        .sidebar .nav-link { align-items: center; border-radius: 7px; color: #c7d1e0; display: flex; gap: .8rem; margin: .2rem 0; padding: .68rem .75rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: var(--navy-soft); color: #fff; }
        .sidebar .nav-link.active { box-shadow: inset 3px 0 #4a83ff; }
        .sidebar .nav-link i { font-size: 1rem; width: 18px; }
        .main-panel { margin-left: 248px; min-width: 0; }
        .topbar { align-items: center; background: #fff; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; min-height: 68px; padding: .75rem 2rem; }
        .topbar-kicker { color: var(--muted); font-size: .75rem; }
        .topbar-user { align-items: center; color: var(--ink); display: flex; font-size: .84rem; font-weight: 600; gap: .65rem; }
        .avatar { align-items: center; background: #e9efff; border-radius: 50%; color: var(--blue); display: inline-flex; height: 34px; justify-content: center; width: 34px; }
        .page-content { margin: 0 auto; max-width: 1600px; padding: 1.8rem 2rem 3rem; }
        .page-heading { font-size: 1.45rem; font-weight: 750; letter-spacing: -.025em; }
        .page-subtitle { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
        .card { border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 8px rgba(24, 39, 75, .035); }
        .card-header { border-bottom-color: var(--line); padding: 1rem 1.15rem; }
        .card-body { padding: 1.15rem; }
        .metric-label { color: var(--muted); font-size: .8rem; font-weight: 550; }
        .metric-value { color: var(--ink); font-size: clamp(1.35rem, 2vw, 1.8rem); font-weight: 750; letter-spacing: -.035em; }
        .metric-icon { align-items: center; background: #edf2ff; border-radius: 9px; color: var(--blue); display: flex; font-size: 1.05rem; height: 38px; justify-content: center; width: 38px; }
        .metric-icon.green { background: #eaf8f0; color: #198754; }
        .metric-icon.red { background: #fff0f0; color: #dc3545; }
        .metric-icon.amber { background: #fff6e5; color: #b77908; }
        .progress { background: #edf0f5; border-radius: 8px; height: 8px; }
        .table { --bs-table-bg: transparent; }
        .table th { border-bottom-width: 1px; color: var(--muted); font-size: .72rem; font-weight: 650; letter-spacing: .04em; white-space: nowrap; }
        .table td { color: #33415a; vertical-align: middle; }
        .table > :not(caption) > * > * { padding: .8rem .75rem; }
        .btn-primary { background: var(--blue); border-color: var(--blue); }
        .btn-primary:hover { background: #1d53c4; border-color: #1d53c4; }
        .chart-row { align-items: center; display: grid; gap: 1rem; grid-template-columns: 88px 1fr auto; margin: .8rem 0; }
        .chart-track { background: #edf0f5; border-radius: 99px; height: 10px; overflow: hidden; }
        .chart-bar { background: linear-gradient(90deg, #2764e7, #71a0ff); border-radius: inherit; height: 100%; }
        .chart-label, .chart-value { font-size: .8rem; }
        .chart-label { color: #53627a; }
        .chart-value { color: var(--ink); font-weight: 650; }
        .table-responsive { border-radius: inherit; }
        .form-label { color: #53627a; font-size: .8rem; font-weight: 650; }
        .form-control, .form-select, .input-group-text { border-color: #dfe5ee; border-radius: 7px; font-size: .88rem; min-height: 40px; }
        .form-control:focus, .form-select:focus { border-color: #8eafff; box-shadow: 0 0 0 .2rem rgba(39, 100, 231, .12); }
        .empty-state { color: var(--muted); padding: 2.5rem 1rem; text-align: center; }
        .empty-state i { color: #a8b4c5; display: block; font-size: 1.7rem; margin-bottom: .6rem; }
        .table tfoot td { background: #f8f9fc; border-top: 1px solid var(--line); }
        @media (max-width: 767.98px) {
            .sidebar { bottom: auto; padding: .65rem .75rem; position: relative; top: auto; width: 100%; }
            .brand { margin: .2rem .4rem .65rem; }
            .sidebar nav { display: flex; gap: .35rem; overflow-x: auto; }
            .nav-section { display: none; }
            .sidebar .nav-link { flex: 0 0 auto; font-size: .8rem; margin: 0; padding: .55rem .65rem; }
            .sidebar .nav-link.active { box-shadow: inset 0 -2px #4a83ff; }
            .main-panel { margin-left: 0; }
            .topbar { min-height: 54px; padding: .65rem 1rem; }
            .page-content { padding: 1.25rem 1rem 2rem; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="/">
            <span class="brand-mark"><i class="bi bi-bar-chart-line-fill"></i></span>
            <span><span class="brand-name d-block">NEXUS</span><span class="brand-caption">BUDGET MANAGEMENT</span></span>
        </a>
        <nav aria-label="メインナビゲーション">
            <div class="nav-section">ワークスペース</div>
            <a class="nav-link" href="/" th:classappend="${activeNav == 'dashboard'} ? 'active'"><i class="bi bi-grid-1x2-fill"></i><span>ダッシュボード</span></a>
            <a class="nav-link" href="/budgets" th:classappend="${activeNav == 'budgets'} ? 'active'"><i class="bi bi-wallet2"></i><span>予算管理</span></a>
            <a class="nav-link" href="/budget-change-requests" th:classappend="${activeNav == 'budget-changes'} ? 'active'"><i class="bi bi-arrow-left-right"></i><span>予算変更申請</span></a>
            <a class="nav-link" href="/reports/budget-vs-actual" th:classappend="${activeNav == 'reports'} ? 'active'"><i class="bi bi-bar-chart-line"></i><span>予実レポート</span></a>
            <a class="nav-link" href="/requests" th:classappend="${activeNav == 'requests'} ? 'active'"><i class="bi bi-check2-square"></i><span>申請・承認</span></a>
            <a class="nav-link" href="/organization" th:classappend="${activeNav == 'organization'} ? 'active'"><i class="bi bi-diagram-3"></i><span>部門・プロジェクト</span></a>
            <div class="nav-section">データ管理</div>
            <a class="nav-link" href="/transactions" th:classappend="${activeNav == 'transactions'} ? 'active'"><i class="bi bi-receipt"></i><span>取引</span></a>
            <a class="nav-link" href="/categories" th:classappend="${activeNav == 'categories'} ? 'active'"><i class="bi bi-tags"></i><span>カテゴリ</span></a>
            <a class="nav-link" href="/accounting" th:classappend="${activeNav == 'accounting'} ? 'active'"><i class="bi bi-arrow-repeat"></i><span>会計連携</span></a>
            <a class="nav-link" href="/audit-logs" th:classappend="${activeNav == 'audit'} ? 'active'"><i class="bi bi-clock-history"></i><span>監査ログ</span></a>
            <a class="nav-link" href="/team" th:classappend="${activeNav == 'team'} ? 'active'"><i class="bi bi-people"></i><span>ユーザー・権限</span></a>
        </nav>
    </aside>
    <div class="main-panel">
        <header class="topbar">
            <div class="topbar-kicker">予算管理 / ワークスペース</div>
            <div class="topbar-user"><span class="avatar"><i class="bi bi-person-fill"></i></span><span>ワークスペース</span>
                <form th:action="@{/logout}" method="post" class="ms-2"><button class="btn btn-sm btn-outline-secondary" type="submit">ログアウト</button></form>
            </div>
        </header>
        <main class="page-content">
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:replace="${content}">Content</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
