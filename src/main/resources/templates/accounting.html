<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>会計連携 | 予算管理</title>
</head>
<body>
<div th:fragment="content" id="accountingSyncPage">
    <div class="mb-4">
        <h1 class="page-heading mb-0">会計連携</h1>
        <p class="page-subtitle mb-0">同期の接続状態と実行履歴を確認します。</p>
    </div>

    <div class="alert alert-info" role="status">
        会計サービスは未選定です。同期処理はJavaの接続アダプター経由で実行し、実行履歴と実績データはオンライン側と同じデータベースに保存します。
    </div>
    <p class="small text-muted" th:if="${#lists.isEmpty(supportedProviders)}">同期コネクタはまだ登録されていません。会計サービスを選定した後に接続処理を追加します。</p>
    <div class="alert d-none" id="syncFeedback" role="status" aria-live="polite"></div>

    <section class="card mb-4">
        <div class="card-header bg-white fw-semibold">接続</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>接続名</th><th>サービス</th><th>状態</th><th class="text-end">操作</th></tr></thead>
                <tbody>
                <tr th:each="connection : ${connections}">
                    <td th:text="${connection.displayName}">会計サービス</td>
                    <td th:text="${connection.provider}">未選定</td>
                    <td><span class="badge text-bg-secondary" th:text="${connection.status}">NOT_CONFIGURED</span></td>
                    <td class="text-end">
                        <form th:if="${connection.status == 'CONNECTED'}" class="d-inline" method="post"
                              th:action="@{/api/accounting/connections/{id}/sync(id=${connection.id})}" data-sync-form>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-primary" type="submit">同期を開始</button>
                        </form>
                        <span th:if="${connection.status != 'CONNECTED'}" class="small text-muted">接続設定が必要です</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(connections)}"><td colspan="4" class="text-center text-muted py-4">会計接続はまだ登録されていません。</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold">同期履歴</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshSyncRuns">更新</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>受付日時</th><th>サービス</th><th>状態</th><th class="text-end">取得</th><th class="text-end">取込</th><th>詳細</th></tr></thead>
                <tbody id="syncRunsBody">
                <tr th:each="run : ${syncRuns}" th:attr="data-run-id=${run.id}">
                    <td th:text="${#temporals.format(run.queuedAt, 'yyyy/MM/dd HH:mm')}">2026/10/25 10:00</td>
                    <td th:text="${run.provider}">会計サービス</td>
                    <td th:text="${run.status}">QUEUED</td>
                    <td class="text-end" th:text="${run.fetchedCount}">0</td>
                    <td class="text-end" th:text="${run.importedCount}">0</td>
                    <td class="small text-muted">
                        <span th:text="${run.errorMessage}"></span>
                        <form th:if="${(run.status == 'FAILED' or run.status == 'PARTIAL_SUCCESS') and #lists.contains(supportedProviders, run.provider)}"
                              class="d-inline ms-2" method="post"
                              th:action="@{/api/accounting/sync-runs/{id}/retry(id=${run.id})}" data-retry-form>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-primary" type="submit">再試行</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(syncRuns)}" id="emptySyncRuns"><td colspan="6" class="text-center text-muted py-4">同期履歴はありません。</td></tr>
                </tbody>
            </table>
        </div>
    </section>
    <script th:src="@{/js/accounting-sync.js}" defer></script>
</div>
</body>
</html>
