<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>招待を受諾 | NEXUS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><main class="card border-0 shadow-sm mx-auto mt-5 auth-message-card invitation-card"><div class="card-body p-5"><h1 class="h4">招待を受諾</h1><p class="text-muted">新しいパスワードを設定してください（12文字以上）。</p><div th:if="${param.inviteError}" class="alert alert-danger">招待リンクが無効か期限切れ、またはパスワードが一致しません。</div>
    <form th:action="@{/accept-invitation}" method="post"><input type="hidden" name="token" th:value="${token}"><div class="mb-3"><label class="form-label" for="password">パスワード</label><input class="form-control" id="password" name="password" type="password" minlength="12" maxlength="72" required></div><div class="mb-4"><label class="form-label" for="passwordConfirmation">パスワード（確認）</label><input class="form-control" id="passwordConfirmation" name="passwordConfirmation" type="password" minlength="12" maxlength="72" required></div><button class="btn btn-primary w-100">パスワードを設定</button></form>
</div></main></body></html>
