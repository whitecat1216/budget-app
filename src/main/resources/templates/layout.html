<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">予算管理アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="/">
            <span class="brand-mark"><i class="bi bi-bar-chart-line-fill"></i></span>
            <span><span class="brand-name d-block">NEXUS</span><span class="brand-caption">BUDGET MANAGEMENT</span></span>
        </a>
        <nav aria-label="メインナビゲーション">
            <div class="nav-section">ワークスペース</div>
            <a class="nav-link" href="/" th:classappend="${activeNav == 'dashboard'} ? 'active'"><i class="bi bi-grid-1x2-fill"></i><span>ダッシュボード</span></a>
            <a class="nav-link" href="/budgets" th:classappend="${activeNav == 'budgets'} ? 'active'"><i class="bi bi-wallet2"></i><span>予算管理</span></a>
            <a class="nav-link" href="/budget-change-requests" th:classappend="${activeNav == 'budget-changes'} ? 'active'"><i class="bi bi-arrow-left-right"></i><span>予算変更申請</span></a>
            <a class="nav-link" href="/reports/budget-vs-actual" th:classappend="${activeNav == 'reports'} ? 'active'"><i class="bi bi-bar-chart-line"></i><span>予実レポート</span></a>
            <a class="nav-link" href="/requests" th:classappend="${activeNav == 'requests'} ? 'active'"><i class="bi bi-check2-square"></i><span>申請・承認</span></a>
            <a class="nav-link" href="/notifications" th:classappend="${activeNav == 'notifications'} ? 'active'"><i class="bi bi-bell"></i><span>通知</span></a>
            <a class="nav-link" href="/organization" th:classappend="${activeNav == 'organization'} ? 'active'"><i class="bi bi-diagram-3"></i><span>部門・プロジェクト</span></a>
            <div class="nav-section">データ管理</div>
            <a class="nav-link" href="/transactions" th:classappend="${activeNav == 'transactions'} ? 'active'"><i class="bi bi-receipt"></i><span>取引</span></a>
            <a class="nav-link" href="/categories" th:classappend="${activeNav == 'categories'} ? 'active'"><i class="bi bi-tags"></i><span>カテゴリ</span></a>
            <a class="nav-link" href="/account-codes" th:classappend="${activeNav == 'account-codes'} ? 'active'"><i class="bi bi-list-ol"></i><span>勘定科目</span></a>
            <a class="nav-link" href="/accounting" th:classappend="${activeNav == 'accounting'} ? 'active'"><i class="bi bi-arrow-repeat"></i><span>会計連携</span></a>
            <a class="nav-link" href="/audit-logs" th:classappend="${activeNav == 'audit'} ? 'active'"><i class="bi bi-clock-history"></i><span>監査ログ</span></a>
            <a class="nav-link" href="/team" th:classappend="${activeNav == 'team'} ? 'active'"><i class="bi bi-people"></i><span>ユーザー・権限</span></a>
        </nav>
    </aside>
    <div class="main-panel">
        <header class="topbar">
            <div class="topbar-kicker">予算管理 / ワークスペース</div>
            <div class="topbar-user"><span class="avatar"><i class="bi bi-person-fill"></i></span><span>ワークスペース</span>
                <form th:action="@{/logout}" method="post" class="ms-2"><button class="btn btn-sm btn-outline-secondary" type="submit">ログアウト</button></form>
            </div>
        </header>
        <main class="page-content">
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:replace="${content}">Content</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
